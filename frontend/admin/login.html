<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台管理 - SMSF 接码平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); width: 400px; max-width: 90vw; }
    h1 { text-align: center; color: #333; margin-bottom: 8px; font-size: 22px; }
    .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 14px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; font-weight: 500; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #2c3e50; }
    button { width: 100%; padding: 12px; background: #2c3e50; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:hover { background: #34495e; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; display: none; background: #fee; color: #e74c3c; border: 1px solid #fcc; }
  </style>
</head>
<body>
  <div class="container">
    <h1>后台管理</h1>
    <p class="subtitle">SMSF 接码平台管理系统</p>
    <div class="alert" id="alert"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>管理员账号</label>
        <input type="text" id="username" placeholder="请输入管理员账号" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" required>
      </div>
      <button type="submit">登 录</button>
    </form>
  </div>
  <script>
    const API = '';
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return showAlert('请填写账号和密码');
      const btn = e.target.querySelector('button');
      btn.disabled = true; btn.textContent = '登录中...';
      try {
        const res = await fetch(API + '/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.code === 0 && data.data.role === 'admin') {
          localStorage.setItem('token', data.data.token);
          localStorage.setItem('user', JSON.stringify(data.data));
          window.location.href = '/admin/dashboard';
        } else if (data.code === 0) {
          showAlert('非管理员账号');
        } else {
          showAlert(data.msg);
        }
        btn.disabled = false; btn.textContent = '登录';
      } catch (err) { showAlert('网络错误'); btn.disabled = false; btn.textContent = '登录'; }
    });
    function showAlert(msg) { const el = document.getElementById('alert'); el.textContent = msg; el.style.display = 'block'; }
    (function() {
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (token && user.role === 'admin') window.location.href = '/admin/dashboard';
    })();
  </script>
</body>
</html>
