<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单管理 - SMSF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; }
    .sidebar { width: 220px; background: #2c3e50; color: #fff; padding: 20px 0; min-height: 100vh; }
    .sidebar h3 { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.15); font-size: 16px; }
    .sidebar a { display: block; padding: 12px 20px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; transition: background 0.2s; border-left: 3px solid transparent; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.08); border-left-color: #3498db; color: #fff; }
    .main { flex: 1; padding: 24px; }
    .section { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .section h4 { margin-bottom: 12px; color: #333; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px; border-bottom: 1px solid #eee; color: #666; font-weight: 500; background: #fafafa; }
    td { padding: 8px; border-bottom: 1px solid #f5f5f5; }
    .status { padding: 2px 8px; border-radius: 10px; font-size: 11px; display: inline-block; }
    .status-pending { background: #ffeaa7; color: #d68910; }
    .status-waiting_sms { background: #81ecec; color: #0a7e7e; }
    .status-completed { background: #55efc4; color: #007a4d; }
    .status-cancelled, .status-released, .status-blacklisted { background: #dfe6e9; color: #636e72; }
    .status-failed { background: #fab1a0; color: #c0392b; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>SMSF 管理后台</h3>
    <a href="/admin/dashboard">首页概览</a>
    <a href="/admin/services">服务管理</a>
    <a href="/admin/cards">卡密管理</a>
    <a href="/admin/users">用户管理</a>
    <a href="/admin/orders" class="active">订单管理</a>
  </div>

  <div class="main">
    <h2 style="margin-bottom:20px;">订单管理</h2>

    <div class="section">
      <h4>所有订单</h4>
      <table>
        <thead><tr><th>ID</th><th>用户</th><th>服务</th><th>号码</th><th>Firefox订单ID</th><th>金额</th><th>状态</th><th>时间</th></tr></thead>
        <tbody id="orderTableBody"><tr><td colspan="8">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = '';
    function getHeaders() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('token') || '') }; }
    function checkAdmin() { if (!localStorage.getItem('token')) { window.location.href = '/admin'; return false; } return true; }
    async function apiFetch(path, options = {}) {
      const res = await fetch(API + path, { ...options, headers: { ...getHeaders(), ...(options.headers || {}) } });
      if (res.status === 401) { localStorage.clear(); window.location.href = '/admin'; throw new Error('Unauthorized'); }
      return res;
    }

    async function loadOrders() {
      if (!checkAdmin()) return;
      const res = await apiFetch('/api/admin/orders');
      const data = await res.json();
      if (data.code === 0) {
        const statusMap = { pending: '待获取', waiting_sms: '等待验证码', completed: '已完成', cancelled: '已取消', released: '已释放', blacklisted: '已拉黑', failed: '失败' };
        let html = '';
        data.data.orders.forEach(o => {
          html += `<tr>
            <td>${o.id}</td>
            <td>${o.username || '-'}</td>
            <td>${o.service_name || '-'}</td>
            <td>${o.phone_number || '-'}</td>
            <td style="font-size:12px;">${o.firefox_order_id || '-'}</td>
            <td>¥${o.amount.toFixed(2)}</td>
            <td><span class="status status-${o.status}">${statusMap[o.status] || o.status}</span></td>
            <td>${o.created_at}</td>
          </tr>`;
        });
        document.getElementById('orderTableBody').innerHTML = html || '<tr><td colspan="8">暂无订单</td></tr>';
      }
    }

    loadOrders();
  </script>
</body>
</html>
