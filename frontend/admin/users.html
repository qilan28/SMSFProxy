<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理 - SMSF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; }
    .sidebar { width: 220px; background: #2c3e50; color: #fff; padding: 20px 0; min-height: 100vh; }
    .sidebar h3 { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.15); font-size: 16px; }
    .sidebar a { display: block; padding: 12px 20px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; transition: background 0.2s; border-left: 3px solid transparent; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.08); border-left-color: #3498db; color: #fff; }
    .main { flex: 1; padding: 24px; }
    .section { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .section h4 { margin-bottom: 12px; color: #333; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .btn { padding: 6px 14px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; color: #fff; }
    .btn-success { background: #27ae60; }
    .btn-danger { background: #e74c3c; }
    .btn-warning { background: #f39c12; color: #fff; }
    .btn-primary { background: #3498db; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px; border-bottom: 1px solid #eee; color: #666; font-weight: 500; background: #fafafa; }
    td { padding: 8px; border-bottom: 1px solid #f5f5f5; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
    .badge-user { background: #d4edda; color: #155724; }
    .badge-admin { background: #cce5ff; color: #004085; }
    .badge-active { background: #d4edda; color: #155724; }
    .badge-disabled { background: #f8d7da; color: #721c24; }
    input { padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; width: 80px; }
    .toast { position: fixed; top: 20px; right: 20px; padding: 10px 24px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast-success { background: #27ae60; }
    .toast-error { background: #e74c3c; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3 id="sidebarTitle">SMSF 管理后台</h3>
    <a href="/admin/dashboard">首页概览</a>
    <a href="/admin/services">服务管理</a>
    <a href="/admin/cards">卡密管理</a>
    <a href="/admin/users" class="active">用户管理</a>
    <a href="/admin/orders">订单管理</a>
    <a href="/admin/settings">网站设置</a>
  </div>

  <div class="main">
    <h2 style="margin-bottom:20px;">用户管理</h2>

    <div class="section">
      <h4>用户列表</h4>
      <table>
        <thead><tr><th>ID</th><th>用户名</th><th>余额</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
        <tbody id="userTableBody"><tr><td colspan="7">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';
    function getHeaders() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('token') || '') }; }
    function checkAdmin() { if (!localStorage.getItem('token')) { window.location.href = '/admin'; return false; } return true; }
    async function apiFetch(path, options = {}) {
      const res = await fetch(API + path, { ...options, headers: { ...getHeaders(), ...(options.headers || {}) } });
      if (res.status === 401) { localStorage.clear(); window.location.href = '/admin'; throw new Error('Unauthorized'); }
      return res;
    }

    (async function loadSiteName() {
      try {
        const res = await fetch('/api/site-info');
        const data = await res.json();
        if (data.code === 0 && data.data.site_name) {
          document.getElementById('sidebarTitle').textContent = data.data.site_name + ' 管理后台';
          document.title = '用户管理 - ' + data.data.site_name;
        }
      } catch (e) {}
    })();

    async function loadUsers() {
      if (!checkAdmin()) return;
      const res = await apiFetch('/api/admin/users');
      const data = await res.json();
      if (data.code === 0) {
        let html = '';
        data.data.users.forEach(u => {
          html += `<tr>
            <td>${u.id}</td>
            <td>${u.username}</td>
            <td>¥${u.balance.toFixed(2)}</td>
            <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role}</span></td>
            <td><span class="badge ${u.status === 1 ? 'badge-active' : 'badge-disabled'}">${u.status === 1 ? '正常' : '禁用'}</span></td>
            <td>${u.created_at}</td>
            <td>
 ${u.role !== 'admin' ? `
              <button class="btn btn-warning" onclick="adjustBalance(${u.id})">改余额</button>
              <button class="btn ${u.status === 1 ? 'btn-danger' : 'btn-success'}" onclick="toggleUser(${u.id}, ${u.status === 1 ? 0 : 1})">${u.status === 1 ? '禁用' : '启用'}</button>
 ` : ''}
            </td>
          </tr>`;
        });
        document.getElementById('userTableBody').innerHTML = html || '<tr><td colspan="7">暂无用户</td></tr>';
      }
    }

    async function adjustBalance(userId) {
      const amount = prompt('请输入余额调整量（正数增加，负数减少）:');
      if (amount === null) return;
      const num = parseFloat(amount);
      if (isNaN(num)) return toast('请输入有效数字', 'error');
      const res = await apiFetch('/api/admin/users/balance', {
        method: 'POST',
        body: JSON.stringify({ userId, amount: num })
      });
      const data = await res.json();
      toast(data.msg, data.code === 0 ? 'success' : 'error');
      if (data.code === 0) loadUsers();
    }

    async function toggleUser(userId, status) {
      const res = await apiFetch('/api/admin/users/status', {
        method: 'POST',
        body: JSON.stringify({ userId, status })
      });
      const data = await res.json();
      toast(data.msg, data.code === 0 ? 'success' : 'error');
      if (data.code === 0) loadUsers();
    }

    function toast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = 'toast toast-' + type + ' show';
      setTimeout(() => { el.className = 'toast'; }, 3000);
    }

    loadUsers();
  </script>
</body>
</html>
