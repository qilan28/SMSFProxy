<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - SMSF</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; }
    .sidebar { width: 220px; background: #2c3e50; color: #fff; padding: 20px 0; min-height: 100vh; }
    .sidebar h3 { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.15); font-size: 16px; }
    .sidebar a { display: block; padding: 12px 20px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 14px; transition: background 0.2s; border-left: 3px solid transparent; }
    .sidebar a:hover, .sidebar a.active { background: rgba(255,255,255,0.08); border-left-color: #3498db; color: #fff; }
    .main { flex: 1; padding: 24px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .label { font-size: 13px; color: #888; margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: bold; color: #2c3e50; }
    .section { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .section h4 { margin-bottom: 12px; color: #333; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .btn { padding: 8px 18px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; color: #fff; margin-right: 6px; }
    .btn-primary { background: #3498db; }
    .btn-success { background: #27ae60; }
    input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; margin-right: 8px; outline: none; width: 120px; }
    input:focus { border-color: #3498db; }
    .config-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .config-row label { width: 150px; font-size: 13px; color: #555; text-align: right; }
    .config-row input { flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    th { text-align: left; padding: 8px; border-bottom: 1px solid #eee; color: #666; font-weight: 500; background: #fafafa; }
    td { padding: 8px; border-bottom: 1px solid #f5f5f5; }
    .toast { position: fixed; top: 20px; right: 20px; padding: 10px 24px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 2000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast-success { background: #27ae60; }
    .toast-error { background: #e74c3c; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3 id="sidebarTitle">SMSF 管理后台</h3>
    <a href="/admin/dashboard" class="active">首页概览</a>
    <a href="/admin/services">服务管理</a>
    <a href="/admin/cards">卡密管理</a>
    <a href="/admin/users">用户管理</a>
    <a href="/admin/orders">订单管理</a>
    <a href="/admin/settings">网站设置</a>
  </div>

  <div class="main">
    <h2 style="margin-bottom:20px;">首页概览</h2>

    <div class="stat-grid">
      <div class="stat-card"><div class="label">用户总数</div><div class="value" id="totalUsers">-</div></div>
      <div class="stat-card"><div class="label">总订单数</div><div class="value" id="totalOrders">-</div></div>
      <div class="stat-card"><div class="label">今日订单</div><div class="value" id="todayOrders">-</div></div>
      <div class="stat-card"><div class="label">总营收</div><div class="value" id="totalRevenue">-</div></div>
      <div class="stat-card"><div class="label">今日营收</div><div class="value" id="todayRevenue">-</div></div>
    </div>

    <div class="section">
      <h4>Firefox 对接配置</h4>
      <p style="font-size:13px;color:#888;margin-bottom:12px;">在Firefox后台「API对接」页面获取Token，直接填入即可</p>
      <div class="config-row">
        <label>API 地址</label>
        <input id="cfgApiUrl" placeholder="http://www.firefox.fun" style="width:300px;">
        <button class="btn btn-primary" onclick="saveConfig('firefox_api_url', document.getElementById('cfgApiUrl').value)">保存</button>
      </div>
      <div class="config-row">
        <label>API Token</label>
        <input id="cfgApiToken" placeholder="格式: hash_uid，如 5f633baa8cfda18979333ae8a270984f_109988" style="width:380px;">
        <button class="btn btn-primary" onclick="saveConfig('firefox_api_token', document.getElementById('cfgApiToken').value)">保存</button>
      </div>
    </div>

    <div class="section">
      <h4>快捷操作</h4>
      <button class="btn btn-success" onclick="checkFirefoxBalance()">查询 Firefox 余额</button>
      <span id="foxBalance" style="margin-left:12px;font-size:14px;color:#666;"></span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';
    function getHeaders() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + (localStorage.getItem('token') || '') }; }
    function checkAdmin() { if (!localStorage.getItem('token')) { window.location.href = '/admin'; return false; } return true; }
    async function apiFetch(path, options = {}) {
      const res = await fetch(API + path, { ...options, headers: { ...getHeaders(), ...(options.headers || {}) } });
      if (res.status === 401) { localStorage.clear(); window.location.href = '/admin'; throw new Error('Unauthorized'); }
      return res;
    }

    (async function loadSiteName() {
      try {
        const res = await fetch('/api/site-info');
        const data = await res.json();
        if (data.code === 0 && data.data.site_name) {
          document.getElementById('sidebarTitle').textContent = data.data.site_name + ' 管理后台';
          document.title = data.data.site_name + ' - 管理后台';
        }
      } catch (e) {}
    })();

    async function init() {
      if (!checkAdmin()) return;
      const res = await apiFetch('/api/admin/stats');
      const data = await res.json();
      if (data.code === 0) {
        document.getElementById('totalUsers').textContent = data.data.totalUsers;
        document.getElementById('totalOrders').textContent = data.data.totalOrders;
        document.getElementById('todayOrders').textContent = data.data.todayOrders;
        document.getElementById('totalRevenue').textContent = '¥' + data.data.totalRevenue.toFixed(2);
        document.getElementById('todayRevenue').textContent = '¥' + data.data.todayRevenue.toFixed(2);
      }
      // Load config
      const cfgRes = await apiFetch('/api/admin/config');
      const cfgData = await cfgRes.json();
      if (cfgData.code === 0) {
        if (cfgData.data.firefox_api_url) document.getElementById('cfgApiUrl').value = cfgData.data.firefox_api_url;
        if (cfgData.data.firefox_api_token) document.getElementById('cfgApiToken').value = cfgData.data.firefox_api_token;
      }
    }

    async function saveConfig(key, value) {
      await apiFetch('/api/admin/config', {
        method: 'POST', body: JSON.stringify({ key, value })
      });
      toast('配置已保存，立即生效', 'success');
    }

    async function checkFirefoxBalance() {
      try {
        const res = await apiFetch('/api/admin/firefox-balance');
        const data = await res.json();
        if (data.code === 0 && data.data) {
          document.getElementById('foxBalance').innerHTML =
            '余额: <strong>¥' + data.data.balance + '</strong> | 等级: ' + data.data.level + ' | 积分: ' + data.data.points;
        } else {
          document.getElementById('foxBalance').textContent = data.msg || '查询失败';
        }
      } catch (e) { document.getElementById('foxBalance').textContent = '查询失败'; }
    }

    function toast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = 'toast toast-' + type + ' show';
      setTimeout(() => { el.className = 'toast'; }, 3000);
    }

    init();
  </script>
</body>
</html>
